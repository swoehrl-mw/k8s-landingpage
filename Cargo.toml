[package]
name = "landingpage"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
kube = {version = "3.0.1", features = ["client", "rustls-tls"]}
k8s-openapi = { version = "0.27.0", default-features = false, features = ["v1_31"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["fs", "set-header", "cors"] }
tower-sessions = "0.15.0"
tower = "0.5.3"
thiserror = "2.0.18"
minijinja = "2.16.0"
axum-oidc = "0.6.0"
tracing = { version= "0.1.44", features=["log"] }
tracing-subscriber = { version= "0.3.22", features=["fmt", "json", "std", "registry", "env-filter"] }
kcr_gateway_networking_k8s_io = "3.20260128.213753"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.48"
