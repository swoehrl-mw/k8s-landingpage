[package]
name = "landingpage"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
kube = {version = "4.2.0", features = ["client", "derive", "rustls-tls"]}
k8s-openapi = { version = "0.28.0", default-features = false, features = ["v1_35"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header", "cors"] }
tower-sessions = "0.14.0"  # Keep in sync with axum-oidc
tower = "0.5.3"
thiserror = "2.0.20"
minijinja = "2.24.0"
axum-oidc = "0.6.0"
tracing = { version= "0.1.44", features=["log"] }
tracing-subscriber = { version= "0.3.23", features=["fmt", "json", "std", "registry", "env-filter"] }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"
